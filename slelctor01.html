<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

    /" CSS =/

    *{color:ghostwhite}

    /= 태그 선택지
    h2 {color:gold}

    /= 아이디 선택지
    #select-id {color:green; }

    /*= 클래스 선택지 */
    .select-class {color : orange; }


    /*속성 선택자 */
    [href] {color:PURPLE; }

    [target="_blank"] {color:red; }

    </style>

</head>

<body>
    <h1>h1</h1>
    <h2>h2</h2>
    <h3 id="select-id">h3</h3>
    <h4 class="select-class">h4</h4>
    <h5>h5</h5>

    <p>p 하나</p>
    <p class="select-class">p 둘</p>
    <p>p 셋</p>
    <p>p 넷</p>
</body>
</html>
