    <style>

    /* 그룹 선택자 "," */
    P{ COLOR: RED; }
    STRONG { COLOR: RED; } */

    P STRONG { COLOR: YELLOW; }
    
    P STRONG SPAN { COLOR: GREEN; }

    /* 자식 선택자 ">" */
    div > P { COLOR: WHITE; }
    
    .TOP-DIV > P { COLOR: BLACK; } 

    /* 하위 선택자 " " 띄워쓰기(공백) */
    
    .TOP-DIV P { COLOR: ORANGE; }
    .TOP-DIV SPAN { COLOR: BLUE; }
    
    /* 인접 형제 선택자 "+" */
    
    P + SPAN { COLOR: PURPLE; }
    
    /* 일반 형제 선택자 "~" */
    
    P ~ SPAN { COLOR: PINK; }
    
    /* 가상 요소 선택자 :: BEFORE, :: AFTER  */
    
    P::before { CONTENT: 
        COLOR:""
    COLOR: RED; }

    #vr-p::after
    { CONTENT: " ...!";
    COLOR: BLUE; }


    /* 가상 클래스 선택자 */
    A:link { COLOR: RED; }
    A:visited { COLOR: PURPLE; }
    

    a:hover { COLOR: ORANGE; }
    a:active { COLOR: GREEN; }
</style>






<body>
